{% extends "admin/base.html" %}
{% load i18n %}

{% block userlinks %}
    <form action="{% url 'set_language' %}" method="post" style="display: inline-block; margin-right: 15px; margin-left: 15px;">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.get_full_path }}">
        <select name="language" onchange="this.form.submit()" style="padding: 2px 6px; font-size: 12px; border-radius: 4px; background: #fff; color: #333;">
            {% get_current_language as LANGUAGE_CODE %}
            {% get_available_languages as LANGUAGES %}
            {% for lang in LANGUAGES %}
                <option value="{{ lang.0 }}" {% if lang.0 == LANGUAGE_CODE %}selected{% endif %}>
                    {{ lang.1 }}
                </option>
            {% endfor %}
        </select>
    </form>
    {{ block.super }}
{% endblock %}
